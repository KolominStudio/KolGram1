<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <title>KolGram — от Kolomin Studio</title>
  <style>
    :root {
      --bg: #0b1120;
      --text: #eef2f8;
      --muted: #9aa8bf;
      --accent: #4f8ef7;
      --accent-2: #8b5cf6;
      --grad: linear-gradient(135deg, #4f8ef7, #8b5cf6);
      --glass: rgba(255, 255, 255, .055);
      --glass-strong: rgba(255, 255, 255, .09);
      --glass-border: rgba(255, 255, 255, .13);
      --glass-border-2: rgba(255, 255, 255, .22);
      --hover: rgba(255, 255, 255, .09);
      --panel-blur: blur(22px) saturate(160%);
      --bubble-in: rgba(255, 255, 255, .07);
      --bubble-out: linear-gradient(135deg, rgba(63, 124, 224, .92), rgba(107, 92, 224, .92));
      --verified: #38bdf8;
      --danger: #f16a6a;
      --online: #4ade80;
      --track: rgba(255, 255, 255, .1);
      --shadow: 0 18px 60px rgba(0, 0, 0, .5);
      --app-font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --app-size: 14.5px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--app-font); }
    
    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      transition: background .3s ease, color .3s ease;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 480px; height: 480px; top: -140px; left: -120px; background: rgba(79, 142, 247, .4); animation: float1 14s ease-in-out infinite alternate; }
    .orb-2 { width: 420px; height: 420px; bottom: -120px; right: -100px; background: rgba(139, 92, 246, .38); animation: float2 17s ease-in-out infinite alternate; }
    .orb-3 { width: 320px; height: 320px; bottom: 20%; left: 30%; background: rgba(56, 189, 248, .22); animation: float1 20s ease-in-out infinite alternate-reverse; }

    @keyframes float1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(70px, 50px) scale(1.15); } }
    @keyframes float2 { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-60px, -40px) scale(.95); } }

    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border-2); border-radius: 4px; }

    /* --- Login Screen --- */
    #login {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    #login .logo {
      width: 96px; height: 96px; border-radius: 28px; background: var(--grad);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 800; color: #fff;
      box-shadow: 0 12px 40px rgba(79, 142, 247, .45);
    }
    #login h1 { font-size: 30px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #login .studio { font-size: 12px; color: var(--muted); margin-top: -8px; letter-spacing: .5px; }
    #login input {
      width: 300px; padding: 13px 16px; border-radius: 14px;
      border: 1px solid var(--glass-border); background: var(--glass);
      backdrop-filter: var(--panel-blur); color: var(--text); outline: none;
    }
    #login input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79, 142, 247, .18); }
    #login button {
      width: 300px; padding: 13px; border-radius: 14px;
      background: var(--grad); color: #fff; font-size: 16px; font-weight: 600;
      box-shadow: 0 8px 26px rgba(79, 142, 247, .35);
    }
    #login button:hover { filter: brightness(1.1); }
    #login .error { color: var(--danger); font-size: 13px; min-height: 18px; }
    #login .switch { color: var(--accent); font-size: 13px; cursor: pointer; margin-top: 10px; }
    #login .switch:hover { text-decoration: underline; }
    #regFields { display: none; flex-direction: column; gap: 14px; }

    /* --- Greeting Screen --- */
    #greet {
      display: none; position: fixed; inset: 0; z-index: 100;
      align-items: center; justify-content: center;
    }
    #greet .card {
      text-align: center; padding: 50px 66px; width: 400px; max-width: 92vw;
      animation: pop .5s ease;
    }
    #greet .big-av {
      width: 92px; height: 92px; margin: 0 auto 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 700; color: #fff; background-size: cover;
      box-shadow: 0 8px 30px rgba(79, 142, 247, .4);
    }
    #greet h2 { font-size: 25px; margin-bottom: 6px; }
    #greet p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    #greet .progress {
      height: 7px; border-radius: 4px; background: var(--track); overflow: hidden;
    }
    #greet .progress .bar {
      height: 100%; width: 0; background: var(--grad); transition: width 1.9s ease;
    }
    #greet .status { font-size: 11px; color: var(--muted); margin-top: 12px; }
    @keyframes pop { from { transform: scale(.88); opacity: 0; } to { transform: none; opacity: 1; } }

    /* --- Main App --- */
    #app { display: none; height: 100vh; height: 100dvh; position: relative; z-index: 1; }
    .layout { display: flex; height: 100%; }

    .sidebar {
      width: 350px; min-width: 300px; display: flex; flex-direction: column;
      background: var(--glass); backdrop-filter: var(--panel-blur);
      border-right: 1px solid var(--glass-border);
    }
    .topbar { padding: 12px 14px; display: flex; align-items: center; gap: 6px; }
    .topbar .me {
      font-weight: 600; flex: 1; display: flex; align-items: center; gap: 5px;
      min-width: 0; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .topbar .me:hover { color: var(--accent); }
    .icon-btn {
      background: var(--glass-strong); border: 1px solid var(--glass-border);
      color: var(--muted); cursor: pointer; font-size: 14px; padding: 8px;
      border-radius: 12px; transition: background .15s, color .15s;
    }
    .icon-btn:hover { color: var(--text); background: var(--hover); }
    .icon-btn.active { color: var(--accent); border-color: var(--accent); }

    /* Tabs */
    .folder-tabs {
      display: flex; gap: 6px; padding: 0 12px 8px; overflow-x: auto;
      flex-shrink: 0; scrollbar-width: none;
    }
    .folder-tabs::-webkit-scrollbar { display: none; }
    .folder-tab {
      padding: 5px 12px; border-radius: 14px; font-size: 12px;
      color: var(--muted); cursor: pointer; white-space: nowrap;
      background: var(--glass-strong);
    }
    .folder-tab.active {
      background: var(--grad); color: #fff; box-shadow: 0 4px 14px rgba(79, 142, 247, .35);
    }

    .search { margin: 0 12px 10px; }
    .search input {
      width: 100%; padding: 10px 16px; border-radius: 22px;
      border: 1px solid var(--glass-border); background: var(--glass-strong);
      color: var(--text); outline: none;
    }
    .search-empty { padding: 24px 20px; color: var(--muted); font-size: 13px; text-align: center; }

    .results { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
    .result-item {
      display: flex; gap: 12px; padding: 10px 12px; margin: 2px 0;
      cursor: pointer; align-items: center; border-radius: 16px;
      transition: background .15s; border: 1px solid transparent;
    }
    .result-item:hover, .result-item.active { background: var(--hover); border-color: var(--glass-border); }
    .avatar {
      width: 48px; height: 48px; border-radius: 16px; flex-shrink: 0;
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 19px; background-size: cover;
    }
    .result-info { flex: 1; min-width: 0; }
    .result-name { font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .status-line { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-line.online { color: var(--online); }
    .last-msg {
      font-size: 13px; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
    }
    .last-msg .prefix { color: var(--text); opacity: .75; }
    .last-msg .ltime { float: right; font-size: 11px; margin-left: 8px; color: var(--muted); }
    .unread {
      background: var(--grad); color: #fff; font-size: 12px; font-weight: 700;
      min-width: 22px; height: 22px; border-radius: 11px; display: flex;
      align-items: center; justify-content: center; padding: 0 7px;
      box-shadow: 0 4px 12px rgba(79, 142, 247, .4);
    }

    .chat-window { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header {
      padding: 10px 20px; display: flex; align-items: center; gap: 12px;
      cursor: pointer; background: var(--glass);
      backdrop-filter: var(--panel-blur); border-bottom: 1px solid var(--glass-border);
    }
    .chat-header:hover { background: var(--glass-strong); }
    .chat-header .name { font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .chat-header .bio { font-size: 12px; color: var(--muted); }
    .chat-header .bio.online { color: var(--online); }
    .back-btn { display: none; background: none; color: var(--accent); font-size: 22px; cursor: pointer; }

    .messages {
      flex: 1; overflow-y: auto; padding: 22px; display: flex;
      flex-direction: column; gap: 8px; max-width: 1100px; width: 100%;
      margin: 0 auto;
    }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; margin: auto; font-size: 14px; }
    .encrypt-note {
      align-self: center; text-align: center; margin: 2px 0 6px; font-size: 11.5px;
      color: var(--muted); background: var(--glass); border-radius: 12px;
      padding: 6px 14px; max-width: 85%;
    }

    .msg {
      max-width: 58%; padding: 10px 14px; border-radius: 18px;
      font-size: var(--app-size); line-height: 1.45; white-space: pre-wrap;
      word-break: break-word; position: relative; background: var(--bubble-in);
      border: 1px solid var(--glass-border);
    }
    .msg.out {
      align-self: flex-end; background: var(--bubble-out); color: #fff;
      border-bottom-right-radius: 6px; border-color: rgba(255, 255, 255, .22);
    }
    .msg.in { border-bottom-left-radius: 6px; }
    .msg .time { font-size: 11px; opacity: .65; float: right; margin-left: 10px; margin-top: 4px; }
    .msg .author { font-size: 12.5px; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }

    .composer {
      padding: 12px 20px; background: var(--glass);
      backdrop-filter: var(--panel-blur); border-top: 1px solid var(--glass-border);
    }
    .composer-row { display: flex; gap: 10px; align-items: center; }
    .composer-row .attach {
      background: var(--glass-strong); border: 1px solid var(--glass-border);
      color: var(--muted); font-size: 20px; width: 46px; height: 46px;
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
    }
    .composer-row input {
      flex: 1; padding: 12px 18px; border-radius: 24px;
      border: 1px solid var(--glass-border); background: var(--glass-strong);
      color: var(--text); outline: none; font-size: var(--app-size);
    }
    .composer-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79, 142, 247, .14); }
    .composer-row .send {
      background: var(--grad); border: 1px solid rgba(255, 255, 255, .3);
      color: #fff; font-size: 18px; width: 46px; height: 46px;
      border-radius: 50%; cursor: pointer; box-shadow: 0 6px 18px rgba(79, 142, 247, .4);
    }
    .composer-row .send:hover { filter: brightness(1.12); }

    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 130;
      background: var(--glass-strong); backdrop-filter: var(--panel-blur);
      border: 1px solid var(--glass-border-2); padding: 12px 16px;
      border-radius: 16px; cursor: pointer; box-shadow: var(--shadow);
      font-size: 14px; max-width: 320px; animation: slideIn .25s ease;
    }
    .toast .t-title { font-weight: 600; color: var(--accent); font-size: 13px; margin-bottom: 2px; }
    .toast .t-text { font-size: 13px; }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    @media (max-width: 700px) {
      .sidebar { width: 100%; min-width: 0; border-right: none; }
      .chat-window { display: none; }
      body.chat-open .sidebar { display: none; }
      body.chat-open .chat-window { display: flex; }
      .back-btn { display: block; }
      .messages { max-width: none; padding: 12px; }
      .msg { max-width: 85%; }
      .composer { padding: 10px 12px; }
      .composer-row input { padding: 11px 14px; font-size: 16px; }
      .avatar { width: 44px; height: 44px; font-size: 17px; }
      .toast { left: 12px; right: 12px; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Login Screen -->
  <div id="login">
    <div class="logo">K</div>
    <h1>KolGram</h1>
    <div class="studio">BY KOLOMIN STUDIO</div>
    <div id="authFields" style="display:flex;flex-direction:column;gap:14px;">
      <input type="text" id="loginUser" placeholder="Логин" autocomplete="off">
      <input type="password" id="loginPass" placeholder="Пароль">
      <button onclick="doLogin()">Войти</button>
    </div>
    <div id="regFields">
      <input type="text" id="regName" placeholder="Имя и фамилия" autocomplete="off">
      <input type="text" id="regLogin" placeholder="Придумайте логин" autocomplete="off">
      <input type="password" id="regPass" placeholder="Придумайте пароль">
      <button onclick="doRegister()">Зарегистрироваться</button>
    </div>
    <div class="error" id="authError"></div>
    <div class="switch" onclick="toggleAuthMode()">
      <span id="switchText">Нет аккаунта? Зарегистрироваться</span>
    </div>
  </div>

  <!-- Greeting Screen -->
  <div id="greet">
    <div class="card">
      <div class="big-av" style="background-color: #4f8ef7;">T</div>
      <h2>Добро пожаловать!</h2>
      <p>Инициализация сессии и загрузка данных...</p>
      <div class="progress">
        <div class="bar" id="loadBar"></div>
      </div>
      <div class="status" id="loadStatus">Загрузка ресурсов</div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app">
    <div class="layout">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="topbar">
          <div class="me">
            <div class="avatar" style="background-color: #4f8ef7;">T</div>
            Тимофей
          </div>
          <button class="icon-btn" title="Уведомления">🔔</button>
          <button class="icon-btn" title="Настройки">⚙️</button>
        </div>

        <!-- Tabs: All / Personal / Groups / Channels -->
        <div class="folder-tabs">
          <div class="folder-tab active" onclick="switchTab(this, 'all')">Все</div>
          <div class="folder-tab" onclick="switchTab(this, 'personal')">Личные</div>
          <div class="folder-tab" onclick="switchTab(this, 'groups')">Группы</div>
          <div class="folder-tab" onclick="switchTab(this, 'channels')">Каналы</div>
        </div>

        <div class="search">
          <input type="text" placeholder="Поиск по чатам...">
        </div>

        <div class="results" id="chatList">
          <!-- Chat items will be injected here -->
        </div>
      </div>

      <!-- Chat Window -->
      <div class="chat-window">
        <div class="chat-header">
          <button class="back-btn" onclick="exitChat()">←</button>
          <div class="name">
            <div class="avatar" style="background-color: #8b5cf6;">А</div>
            Анна
            <div class="crown" title="Администратор"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M12 3L2 9l10 4 10-4-10-6zm0 2.47l5.5 2.46L12 8.4l-5.5-2.47L12 3.53zm0 10.78l-5.5-2.46L12 8.4l5.5 2.46-5.5 2.46z"/></svg></div>
          </div>
          <div class="bio">Онлайн</div>
        </div>

        <div class="messages" id="messagesBox">
          <div class="empty">Выберите чат из списка слева</div>
        </div>

        <div class="encrypt-note">Сообщения защищены сквозным шифрованием</div>

        <div class="composer">
          <div class="composer-row">
            <button class="attach">📎</button>
            <input type="text" id="messageInput" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send" onclick="sendMessage()">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" onclick="this.style.display='none'">
    <div class="t-title">Успешно!</div>
    <div class="t-text">Сообщение отправлено</div>
  </div>

  <script>
    // --- Mock Data ---
    const chats = [
      { id: 1, name: "Анна", type: "personal", avatar: "#8b5cf6", lastMsg: "Привет, как дела?", time: "10:30", unread: 2, online: true },
      { id: 2, name: "Проект X", type: "group", avatar: "#4f8ef7", lastMsg: "Дедлайн перенесен на пятницу", time: "Вчера", unread: 0 },
      { id: 3, name: "Новости IT", type: "channel", avatar: "#ff9800", lastMsg: "Новый релиз вышел!", time: "12:00", unread: 5 },
      { id: 4, name: "Сергей", type: "personal", avatar: "#9c27b0", lastMsg: "Скинь отчет", time: "15:45", unread: 0 },
      { id: 5, name: "Чат команды", type: "group", avatar: "#00bcd4", lastMsg: "Встреча в 14:00", time: "Сегодня", unread: 3 }
    ];

    // --- Auth Logic ---
    let isRegisterMode = false;

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const authFields = document.getElementById('authFields');
      const regFields = document.getElementById('regFields');
      const switchText = document.getElementById('switchText');
      
      if (isRegisterMode) {
        authFields.style.display = 'none';
        regFields.style.display = 'flex';
        switchText.innerText = "Уже есть аккаунт? Войти";
      } else {
        authFields.style.display = 'flex';
        regFields.style.display = 'none';
        switchText.innerText = "Нет аккаунта? Зарегистрироваться";
      }
    }

    function doLogin() {
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      
      if (!user || !pass) {
        showError("Заполните все поля");
        return;
      }

      // Simulate login
      document.getElementById('login').style.display = 'none';
      document.getElementById('greet').style.display = 'flex';
      
      // Simulate loading
      const bar = document.getElementById('loadBar');
      const status = document.getElementById('loadStatus');
      
      setTimeout(() => {
        bar.style.width = '100%';
        status.innerText = "Готово";
        setTimeout(() => {
          document.getElementById('greet').style.display = 'none';
          document.getElementById('app').style.display = 'block';
          renderChats();
        }, 800);
      }, 1500);
    }

    function doRegister() {
      const name = document.getElementById('regName').value;
      const login = document.getElementById('regLogin').value;
      const pass = document.getElementById('regPass').value;

      if (!name || !login || !pass) {
        showError("Заполните все поля регистрации");
        return;
      }

      alert("Регистрация успешна! Теперь войдите.");
      toggleAuthMode();
    }

    function showError(msg) {
      const el = document.getElementById('authError');
      el.innerText = msg;
      setTimeout(() => el.innerText = '', 3000);
    }

    // --- App Logic ---
    let currentTab = 'all';
    let selectedChat = null;

    function switchTab(el, type) {
      document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      currentTab = type;
      renderChats();
    }

    function renderChats() {
      const list = document.getElementById('chatList');
      list.innerHTML = '';

      const filtered = chats.filter(chat => {
        if (currentTab === 'all') return true;
        return chat.type === currentTab;
      });

      if (filtered.length === 0) {
        list.innerHTML = '<div class="search-empty">Чаты не найдены</div>';
        return;
      }

      filtered.forEach(chat => {
        const div = document.createElement('div');
        div.className = `result-item \${selectedChat === chat.id ? 'active' : ''}`;
        div.onclick = () => openChat(chat);
        div.innerHTML = `
          <div class="avatar" style="background-color: ${chat.avatar};">${chat.name.charAt(0)}</div>
          <div class="result-info">
            <div class="result-name">${chat.name} ${chat.unread > 0 ? `<span class="unread">\${chat.unread}</span>` : ''}</div>
            <div class="status-line ${chat.online ? 'online' : ''}">${chat.online ? 'Онлайн' : 'Был недавно'}</div>
            <div class="last-msg">
              <span class="prefix">Вы:</span> \${chat.lastMsg}
              <span class="ltime">\${chat.time}</span>
            </div>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function openChat(chat) {
      selectedChat = chat.id;
      const headerName = document.querySelector('.chat-header .name');
      const headerBio = document.querySelector('.chat-header .bio');
      const messagesBox = document.getElementById('messagesBox');
      
      // Update header
      headerName.innerHTML = `
        <div class="avatar" style="background-color: ${chat.avatar};">${chat.name.charAt(0)}</div>
        \${chat.name}
      `;
      headerBio.innerText = chat.online ? 'Онлайн' : 'Был недавно';
      headerBio.className = chat.online ? 'bio online' : 'bio';

      // Render dummy messages
      messagesBox.innerHTML = `
        <div class="msg in">
          <div class="author">\${chat.name}</div>
          Привет! Как твои дела? Давно не виделись.
          <div class="time">10:30</div>
        </div>
        <div class="msg out">
          Привет! Все отлично, спасибо. Много работы над новым проектом.
          <div class="time">10:32</div>
        </div>
        <div class="msg in">
          Звучит интересно. Расскажешь подробнее?
          <div class="time">10:35</div>
        </div>
      `;

      // Update sidebar UI
      renderChats();
      
      // Mobile view switch
      document.body.classList.add('chat-open');
    }

    function exitChat() {
      selectedChat = null;
      document.getElementById('messagesBox').innerHTML = '<div class="empty">Выберите чат из списка слева</div>';
      document.body.classList.remove('chat-open');
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const messagesBox = document.getElementById('messagesBox');
      const now = new Date();
      const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg out';
      msgDiv.innerHTML = `
        \${text}
        <div class="time">\${time}</div>
      `;
      messagesBox.appendChild(msgDiv);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      input.value = '';

      // Show toast
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }
  </script>
</body>
</html>
